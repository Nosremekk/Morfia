name: Feature Request
description: Sugerir uma melhoria ou nova funcionalidade
title: "[Enhancement]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou Necessidade
      description: Qual fluxo ou tarefa multimídia você gostaria de facilitar?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução Proposta
    validations:
      required: true
