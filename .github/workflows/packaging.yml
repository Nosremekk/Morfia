name: Packaging (jpackage Multiplatform)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-24.04
          - label: windows-x64
            os: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build JAR and Runtime Dependencies
        run: |
          mvn -B clean package -DskipTests
          mvn -B org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/deps

      - name: Package Linux (tar.gz / deb / rpm) and Verify Runtime
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/linux/package-linux.sh scripts/generate-checksums.sh
          ./packaging/linux/package-linux.sh
          echo "Verifying embedded runtime inside DEB..."
          dpkg-deb -c dist/1.0.0-rc.1/linux-x64/morfia_1.0.0-0.1.rc1_amd64.deb | grep -q "lib/runtime/release"

      - name: Package Windows (zip / exe / msi) and Run Portable Smoke Test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/package-windows.ps1
          $smokeDir = Join-Path $env:RUNNER_TEMP "morfia-win-smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          Expand-Archive -Path "dist\1.0.0-rc.1\windows-x64\morfia-1.0.0-rc.1-windows-x64.zip" -DestinationPath $smokeDir -Force
          $exe = Join-Path $smokeDir "Morfia.exe"
          if (-not (Test-Path $exe)) { throw "Morfia.exe not found in portable ZIP" }
          if (-not (Test-Path (Join-Path $smokeDir "runtime\release"))) { throw "Embedded runtime missing in Windows ZIP" }
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
            Write-Host "Windows launcher Morfia.exe started and remained alive cleanly for 6s."
          } else {
            Write-Host "Windows launcher exited with code $($proc.ExitCode)"
            if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
          }

      - name: Upload Candidate Artifacts (Not Published)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.label }}
          path: dist/1.0.0-rc.1/
          if-no-files-found: warn
