name: Packaging (jpackage Multiplatform)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-24.04
          - label: windows-x64
            os: windows-2022
          - label: macos-arm64
            os: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build JAR and Runtime Dependencies
        run: |
          mvn -B clean package -DskipTests
          mvn -B org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/deps

      - name: Package Linux (tar.gz / deb)
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/linux/package-linux.sh scripts/generate-checksums.sh
          ./packaging/linux/package-linux.sh

      - name: Package Windows (zip / exe / msi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/package-windows.ps1

      - name: Package macOS (app / dmg / pkg)
        if: runner.os == 'macOS'
        run: |
          chmod +x packaging/macos/package-macos.sh scripts/generate-checksums.sh
          ./packaging/macos/package-macos.sh

      - name: Upload Candidate Artifacts (Not Published)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.label }}
          path: dist/1.0.0-rc.1/
          if-no-files-found: warn
