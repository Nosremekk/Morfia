name: Dependency Audit & SBOM

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  sbom-and-audit:
    name: Generate CycloneDX SBOM & CVE Vulnerability Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Export Dependency Tree
        run: mvn -B dependency:tree -DoutputFile=target/dependency-tree.txt

      - name: Generate CycloneDX SBOM
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.0:makeAggregateBom

      - name: Install Trivy and Scan CycloneDX SBOM
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version
          trivy sbom target/bom.json --format table --severity CRITICAL,HIGH,MEDIUM,LOW
          trivy sbom target/bom.json --format json --output target/trivy-sbom-report.json

      - name: Upload SBOM & Vulnerability Reports
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-dependencies
          path: |
            target/bom.json
            target/bom.xml
            target/dependency-tree.txt
            target/trivy-sbom-report.json
          if-no-files-found: warn
