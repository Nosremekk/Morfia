name: CI Multiplatform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            os: ubuntu-24.04
          - label: Windows x86_64
            os: windows-2022
          - label: macOS arm64
            os: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install FFmpeg on Linux (for integration tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install FFmpeg on macOS (for integration tests)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg on Windows (for integration tests)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Run Maven Verify (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn clean verify

      - name: Run Maven Verify (Windows / macOS)
        if: runner.os != 'Linux'
        run: mvn clean verify

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.label }}
          path: target/surefire-reports/
          if-no-files-found: ignore
