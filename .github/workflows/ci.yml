name: CI Multiplatform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            os: ubuntu-24.04
            headless: true
          - label: Windows x86_64
            os: windows-2022
            headless: false
          - label: macOS arm64
            os: macos-14
            headless: false
          - label: macOS x86_64
            os: macos-13
            headless: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install FFmpeg on Linux (if needed for integration tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: winget install --id Gyan.FFmpeg -e --accept-package-agreements --accept-source-agreements

      - name: Run Maven Verify (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn clean verify

      - name: Run Maven Verify (Windows / macOS)
        if: runner.os != 'Linux'
        run: mvn clean verify

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.label }}
          path: target/surefire-reports/
          if-no-files-found: ignore
